<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luv Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1a1236;
  --deep:#2b1b5c;
  --lilac:#cdb8ff;
  --coral:#ff8a9b;
  --cream:#f7f0ff;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--night);color:var(--cream);
  font-family:'DM Sans',system-ui,sans-serif;
  display:grid;place-items:center;overflow:hidden;text-align:center;
}

/* The portal: three rings that open on page load */
.portal{
  position:fixed;left:50%;top:50%;
  width:min(92vmin,680px);aspect-ratio:1;
  transform:translate(-50%,-50%);pointer-events:none;
}
.ring{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--lilac);
  opacity:0;
  animation:open 1.6s cubic-bezier(.2,.8,.2,1) forwards;
}
.ring:nth-child(1){--o:.35}
.ring:nth-child(2){--o:.6;inset:10%;border-color:var(--coral);animation-delay:.15s}
.ring:nth-child(3){--o:.35;inset:20%;animation-delay:.3s}
.glow{
  position:absolute;inset:26%;border-radius:50%;
  background:radial-gradient(circle,var(--deep) 0%,transparent 70%);
}
@keyframes open{
  from{transform:scale(.4);opacity:0}
  to{transform:scale(1);opacity:var(--o)}
}

main{position:relative;padding:1.5rem}
h1{
  font-family:'Unbounded',system-ui,sans-serif;font-weight:700;
  font-size:clamp(3rem,12vmin,5.5rem);letter-spacing:-.02em;line-height:1.05;
}
p{
  margin:1rem auto 2rem;font-size:1.15rem;line-height:1.5;
  color:var(--lilac);max-width:20ch;
}
.enter{
  display:inline-grid;place-items:center;min-width:12rem;padding:.9rem 2.2rem;
  border-radius:999px;background:#000;color:#fff;border:2px solid var(--lilac);
  font:500 1.05rem 'DM Sans',system-ui,sans-serif;text-decoration:none;
  transition:background .2s ease,color .2s ease,border-color .2s ease;
}
.enter span{grid-area:1/1;display:flex;align-items:center;gap:.6rem;transition:opacity .15s ease}
.enter .busy{opacity:0}
.enter:hover,.enter:focus-visible{background:#fff;color:#000;border-color:#fff}
.enter:hover .idle,.enter:focus-visible .idle{opacity:0}
.enter:hover .busy,.enter:focus-visible .busy{opacity:1}
.enter:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
.spinner{
  width:1.05rem;height:1.05rem;border-radius:50%;
  border:2.5px solid #000;border-top-color:transparent;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Click transition: a circle grows out of the button */
.wipe{
  position:fixed;inset:0;background:var(--deep);pointer-events:none;
  clip-path:circle(0 at var(--x,50%) var(--y,50%));
}
.wipe.go{clip-path:circle(150% at var(--x,50%) var(--y,50%));transition:clip-path .7s ease-in}

@media (prefers-reduced-motion:reduce){
  .ring{animation:none;opacity:var(--o)}
  .enter,.enter span{transition:none}
  .spinner{animation:none}
}
</style>
</head>
<body>
  <div class="portal" aria-hidden="true">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <div class="glow"></div>
  </div>

  <main>
    <h1>Luv<br>Games</h1>
    <p>A world to step into.</p>
    <a class="enter" href="home.html" id="enter"><span class="idle">Play</span><span class="busy"><i class="spinner"></i>Redirecting</span></a>
  </main>

  <div class="wipe" id="wipe"></div>

<script>
  const btn = document.getElementById('enter');
  const wipe = document.getElementById('wipe');
  btn.addEventListener('click', e => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    e.preventDefault();
    const r = btn.getBoundingClientRect();
    wipe.style.setProperty('--x', (r.left + r.width / 2) + 'px');
    wipe.style.setProperty('--y', (r.top + r.height / 2) + 'px');
    wipe.classList.add('go');
    setTimeout(() => { window.location.href = btn.href; }, 700);
  });
</script>
</body>
</html>
