<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luv Games</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=DM+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--deep:#2b1b5c;--night:#1a1236;--coral:#ff8a9b;--cream:#f7f0ff}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100dvh;background:var(--night);color:var(--cream);font-family:'DM Sans',system-ui,sans-serif}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.2rem;background:var(--deep)}
  .left{display:flex;align-items:center;gap:1.5rem}
  a,button{font:500 .95rem 'DM Sans',system-ui,sans-serif}
  .back{color:var(--coral);text-decoration:none}
  .brand{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;color:var(--cream);text-decoration:none}
  .back:hover,.brand:hover{text-decoration:underline}
  #fs{padding:.5rem 1.1rem;border-radius:999px;border:2px solid var(--cream);background:transparent;color:var(--cream);cursor:pointer;transition:background .2s ease,color .2s ease}
  #fs:hover,#fs:focus-visible{background:var(--cream);color:#000}
  a:focus-visible,button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
  #stage{flex:1;min-height:0;background:#000}
  iframe{width:100%;height:100%;border:0;display:block}
  .err{padding:2rem}
</style>
</head>
<body>
  <div class="bar">
    <div class="left">
      <a class="brand" href="index.html">Luv Games</a>
      <a class="back" href="home.html">Back to games</a>
    </div>
    <button id="fs" type="button" hidden>Fullscreen</button>
  </div>
  <div id="stage"></div>

<script>
  const p = new URLSearchParams(location.search);
  const game = p.get('game') || '';
  const name = p.get('name') || 'Game';
  const stage = document.getElementById('stage');

  // Only allow files inside this site (no links to other websites)
  const ok = /^[\w\-./ ]+$/.test(game) && !game.includes('..') && !game.startsWith('/') && game.endsWith('.html');
  if (ok) {
    document.title = name + ' | Luv Games';
    const f = document.createElement('iframe');
    f.src = game; f.title = name; f.allow = 'fullscreen; autoplay; gamepad';
    f.setAttribute('allowfullscreen', '');
    stage.appendChild(f);
  } else {
    stage.innerHTML = '<p class="err">That game could not be found. Go back to the games page and pick one.</p>';
  }

  // Fullscreen button (hidden on browsers that don't support it, like iPhone Safari)
  const fs = document.getElementById('fs');
  const canFs = stage.requestFullscreen || stage.webkitRequestFullscreen;
  if (canFs && ok) {
    fs.hidden = false;
    fs.addEventListener('click', () => {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        canFs.call(stage);
      }
    });
    const label = () => { fs.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit fullscreen' : 'Fullscreen'; };
    document.addEventListener('fullscreenchange', label);
    document.addEventListener('webkitfullscreenchange', label);
  }
</script>
</body>
</html>
